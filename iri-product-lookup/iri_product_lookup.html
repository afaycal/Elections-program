<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRI Product Lookup</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1c2430; --muted: #5d6877; --line: #dde2e8;
    --accent: #0b5cad; --accent-soft: #e6f0fa; --ok: #1d7a46; --ok-soft: #e5f4ea;
    --warn: #9a5b00; --warn-soft: #fdf2df; --no: #a12a2a; --no-soft: #fbe9e9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c; --panel: #1b2129; --text: #e4e8ee; --muted: #9aa5b3; --line: #2d3540;
      --accent: #6fb0f0; --accent-soft: #1b2d42; --ok: #6cc795; --ok-soft: #173123;
      --warn: #e8b35c; --warn-soft: #33270f; --no: #f08a8a; --no-soft: #3a1a1a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c; --panel: #1b2129; --text: #e4e8ee; --muted: #9aa5b3; --line: #2d3540;
    --accent: #6fb0f0; --accent-soft: #1b2d42; --ok: #6cc795; --ok-soft: #173123;
    --warn: #e8b35c; --warn-soft: #33270f; --no: #f08a8a; --no-soft: #3a1a1a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  form { display: grid; grid-template-columns: 2fr 1.4fr auto; gap: 10px; align-items: end; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
                     background: var(--bg); color: var(--text); font: inherit; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
           font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); padding: 6px 12px; font-weight: 500; }
  .opts { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; font-size: 13px; color: var(--muted); align-items: center; }
  .verdict { border-left: 5px solid var(--ok); }
  .verdict.maybe { border-left-color: var(--warn); }
  .verdict.none { border-left-color: var(--no); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .b-ok { background: var(--ok-soft); color: var(--ok); }
  .b-maybe { background: var(--warn-soft); color: var(--warn); }
  .b-no { background: var(--no-soft); color: var(--no); }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin: 12px 0; }
  .kv div { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .kv b { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
  .kv span { font-weight: 600; word-break: break-word; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .tbl th, .tbl td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .scroll { overflow-x: auto; }
  details.std > summary { cursor: pointer; color: var(--accent); }
  details.std p { margin: 6px 0; }
  .muted { color: var(--muted); }
  .warnbox { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 13.5px; }
  .web { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; margin: 8px 0; font-size: 14px; }
  .links a { margin-right: 14px; color: var(--accent); }
  .alt { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; }
  .alt > summary { padding: 10px 12px; cursor: pointer; }
  .alt > div { padding: 0 12px 12px; }
  mark { background: #ffe58a; color: #1c2430; padding: 0 1px; border-radius: 2px; }
  @media (max-width: 720px) { form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>IRI Product Lookup</h1>
  <p class="sub">Enter a product (and optionally its manufacturer). The tool searches the IRI standards list and the web
    to find the category, section, HS code, and any decree and standard that apply.</p>

  <div class="card">
    <form id="f">
      <div><label for="q">Product name or HS code</label>
        <input type="text" id="q" placeholder="e.g. steam iron, AA battery, olive oil, 8516.40" autofocus></div>
      <div><label for="co">Manufacturer / company (optional)</label>
        <input type="text" id="co" placeholder="e.g. Philips, Duracell, Ariston"></div>
      <button type="submit">Search</button>
    </form>
    <div class="opts">
      <label style="margin:0"><input type="checkbox" id="useWeb" checked> Search the web (Wikipedia) to identify the product</label>
      <span id="dbInfo"></span>
      <button class="ghost" type="button" id="loadBtn">Load updated Excel…</button>
      <input type="file" id="file" accept=".xlsx,.xls" hidden>
    </div>
  </div>

  <div id="out"></div>
</div>

 "", "1", "1", "24M", "242", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["57", "xx", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-106: Particular requirements for heated carpets and for heating units for room heating installed under removable floor coverings", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-106", "E", "Portable heated carpets and similar appliances, and heating units installed directly under a removable floor covering (carpet, cushioned vinyl or loose-laid parquet) to heat the room in which they are located.", "Flexible heated blankets, pads and clothing; foot warmers and heating mats; sheet heating elements under permanent floors; and industrial appliances and locations with special atmospheres.", "An electric heated carpet laid loose on a living room floor; and a room heating mat installed under loose-laid parquet flooring.", "", "x", "", "", "1", "1", "24M", "121", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["95.09", "85.09", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-14: Particular requirements for kitchen machines", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-14", "E", "Electric kitchen machines for household and similar purposes: blenders, food processors, mincers, graters, peelers, citrus juicers, coffee grinders, egg beaters, ice-cream machines and pasta makers. It does not cover professional appliances for commercial food processing.", "Does not apply to: slicing machines with a circular blade inclined more than 45° from the vertical; bread-making machines; soy milk machines; food waste disposers; ice-cream appliances with an integrated motor-compressor; and commercial kitchen machines.", "A worktop-mounted food processor/blender and a hand-fed electric meat mincer used in a domestic kitchen.", "", "x", "", "", "1", "1", "24M", "203", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["95.09", "85.09", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-16: Particular requirements for food waste disposers", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-16", "E", "Fixed electric food waste disposers installed under the sink, for household and similar purposes, including use by laypersons in shops, light industry and on farms.", "Portable and incinerator-type food waste disposers; appliances exclusively for industrial or commercial use; and locations with special atmospheres. Note: in some countries national water authorities restrict or prohibit the installation of these appliances.", "A fixed food waste disposal unit installed under a kitchen sink.", "", "x", "", "", "1", "1", "24M", "203", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["85.08 / 8508.19 / 8508.6 / 8508.11", "8508.11 / 8508.19 / 8508.60", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-2: Particular requirements for vacuum cleaners and water-suction cleaning appliances", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-2", "E", "Vacuum cleaners and water-suction cleaning appliances for household and similar purposes, including pet grooming vacuums, built-in central suction systems, battery-operated robotic vacuums and power-driven cleaning heads.", "Does not apply to: appliances intended exclusively for industrial purposes; appliances intended for use in locations with corrosive or explosive atmospheres; and wet and dry vacuum cleaners (including power brush types) for commercial use.", "A domestic upright or cylinder vacuum cleaner; a robotic vacuum with an automatic charging dock; and a built-in central suction system.", "", "x", "", "", "1", "1", "24M", "203", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8419.19", "8516.10", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-21: Particular requirements for storage water heaters", "9847", "21/02/2013", "Certificate of Conformity (176)", "Industrial Research Institute or  any laboratory holding international accreditation for the required tests", "NL  EN 60335-2-21", "E", "Electric storage water heaters for household and similar purposes, for heating water below boiling point, and immersion heater units intended for retrofitting into a closed water heater with a heat exchanger.", "Water boiling appliances; instantaneous water heaters; commercial dispensing appliances and vending machines; appliances exclusively for industrial use; and locations with special atmospheres. National regulations often govern the installation of equipment connected to the water mains.", "A wall-mounted or floor-standing electric storage water heater (hot water tank/boiler) installed in a dwelling; and an electric immersion heating element for retrofitting into an existing hot water cylinder.", "", "x", "", "", "1", "1", "24M", "165", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8516.21 / 8516.29", "8516.21 / 8516.29", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-30: Particular requirements for room heaters", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-30", "E", "Electric room heaters for household and similar purposes: convector, fan, liquid-filled radiator, panel, radiant and tubular heaters, ceiling-mounted heating lamp appliances, and heaters for the cabins of parked vehicles.", "Heaters incorporated in air conditioners; appliances intended exclusively for industrial purposes; and locations with corrosive or explosive atmospheres.", "A free-standing electric panel heater or upright oil-filled radiator for heating a living room; and a wall-mounted electric fan heater in a bathroom.", "", "x", "", "", "1", "1", "24M", "121", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8418.21 / 8418.29 / 8418.61", "84.15 / 8418.21 / 8418.29 / 8479.89.90", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-40: Particular requirements for electrical heat pumps, air-conditioners and dehumidifiers", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-40", "E", "Electrical heat pumps (including sanitary hot water heat pumps), air conditioners, dehumidifiers and hydronic fan coil units, for domestic, commercial and light industrial use, including those using flammable refrigerants.", "Humidifiers intended for use with heating and cooling equipment; appliances designed exclusively for industrial processing; and locations with special atmospheres. Refrigeration safety outside the scope of the standard and heated water storage tanks are covered by other standards.", "A domestic split-system air conditioner (indoor unit + outdoor unit); a portable dehumidifier used in a dwelling; and a domestic air-to-water heat pump for space heating.", "", "x", "", "", "1", "1", "24M", "242", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8422.11", "8422.11", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-5: Particular requirements for dishwashers", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-5", "E", "Electric dishwashers for household and similar purposes for washing and rinsing dishes, cutlery and other utensils, including use by laypersons in shops, light industry and on farms, but not professional appliances for commercial washing.", "Does not apply to commercial electric dishwashing machines. The general exclusions of the general part also apply (exclusively industrial use, special atmospheres).", "A free-standing or built-in domestic dishwasher; and a portable countertop dishwasher.", "", "x", "", "", "1", "1", "24M", "242", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8413.81 / 8413.82", "8413.81 / 8413.82 / 8418.61", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-51: Particular requirements for stationary circulation pumps for heating and service water installations", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-51", "E", "Fixed electric circulation pumps for household and similar purposes in heating or service water systems, whose hydraulic and electrical parts may share one enclosure or be separate. Commercial use is addressed in a dedicated annex.", "Does not apply to: pumps intended to circulate liquids other than water; pumps other than circulation pumps; circulation pumps intended exclusively for industrial purposes; and locations with special atmospheres.", "A central heating circulation (booster) pump installed on the flow pipe of a domestic boiler.", "", "x", "", "", "1", "1", "24M", "110", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["xxxx", "8509.80", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-52: Particular requirements for oral hygiene appliances", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-52", "E", "Electric oral hygiene appliances for household and similar purposes: oral irrigators (water flossers) and electric toothbrushes.", "Does not apply to appliances intended for medical purposes (covered by the EN/ series). The general exclusions of the general part also apply (locations with special atmospheres, and vehicles, ships and aircraft, which require additional requirements).", "A battery-operated electric toothbrush with a charging base; and a countertop oral irrigator (water flosser).", "", "x", "", "", "1", "1", "24M", "99", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["85.08", "85.08", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-54: Particular requirements for surface-cleaning appliances for household use employing liquids or steam", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-54", "E", "Electric household surface-cleaning appliances employing liquid cleaning agents or steam for cleaning windows, walls and empty swimming pools, and wallpaper stripping appliances, where the product of pressure and vessel volume does not exceed 5 and part of the appliance is hand-held.", "Does not apply to: high pressure cleaners and steam cleaners exceeding the pressure-volume product limit; and fabric steamers. The general exclusions of the general part also apply.", "A hand-held steam cleaner used to clean windows and tiled walls; and an electric steam wallpaper stripper.", "", "x", "", "", "1", "1", "24M", "203", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["xxxx", "8543.70.90", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-55: Particular requirements for electrical appliances for use with aquariums and garden ponds", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-55", "E", "Electrical appliances used with aquariums and garden ponds for household and similar purposes: aerators, heaters, automatic feeders and sludge extractors.", "Does not apply to: pumps; other portable immersion heaters; luminaires for aquariums and garden ponds; outdoor appliances rated above 100 W; appliances intended exclusively for professional use; and locations with special atmospheres.", "A submersible aquarium heater with a thermostat; and an automatic fish feeder on a domestic aquarium.", "", "x", "", "", "1", "1", "24M", "110", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["xxxx", "9405.40.35", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-56: Particular requirements for projectors and similar appliances", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-56", "E", "Electric projectors and similar appliances for household and similar purposes (≤ 250 V), including use by laypersons in shops and light industry.", "The general exclusions of the series apply: exclusively industrial use, locations with special atmospheres, and vehicles, ships and aircraft. Projector performance and electromagnetic compatibility aspects are covered by separate standards.", "A home cinema video projector used in a living room.", "", "x", "", "", "1", "1", "24M", "165", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8543.70.90", "8543.70.90", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-59: Particular requirements for insect killers", "9847", "18/01/2002", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-59", "E", "Electric insect killers for household and similar purposes, including use by laypersons in shops, light industry and on farms.", "The general exclusions of the general part apply (exclusively industrial use, locations with special atmospheres). Insect killers intended for outdoor use must achieve at least degree of protection IPX4 (this is not a separate excluded category but a construction requirement).", "An ultraviolet electric insect killer (\"bug zapper\") hung on a covered balcony (outdoor, ≥ IPX4) or used indoors in a kitchen.", "", "x", "", "", "1", "1", "24M", "99", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8419.81 / 85.09 / 8516.71 / 8516.72 / 8516.60", "8414.60", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-6: Particular requirements for stationary cooking ranges, hobs, ovens and similar appliances", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-6", "E", "Fixed electric cooking ranges, hobs, ovens and similar appliances for household use: griddles, grills, induction hobs, pyrolytic self-cleaning ovens and steam ovens.", "Does not apply to: grills, toasters and similar portable cooking appliances; commercial catering cooking appliances (, 37, 38, 39 and 42); and locations with special atmospheres.", "A built-in electric oven with an induction hob in a domestic kitchen; and a free-standing electric cooking range with a grill function.", "", "x", "", "", "1", "1", "24M", "203", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["xxxx", "8509.80", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-60: Particular requirements for whirlpool baths and whirlpool spas", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-60", "E", "Indoor electric whirlpool baths and factory-made, self-contained whirlpool spas for household and similar purposes, including air or water circulation devices in conventional bath tubs and units used in hotels.", "Swimming pool water circulation equipment; pool cleaning appliances; medical devices; site-engineered, non-self-contained whirlpool baths and spas; and locations with special atmospheres.", "A self-contained indoor whirlpool bath (a bath tub fitted with jets) installed in a domestic bathroom; and a factory-made outdoor whirlpool spa used in a hotel.", "", "x", "", "", "1", "1", "24M", "242", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8508.11 / 8508.19 / 8508.6 / 8509.8", "8508.11 / 8508.19 / 8508.60 / 8509.80", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-65: Particular requirements for air-cleaning appliances", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-65", "E", "Electric air-cleaning appliances for household and similar purposes, including use in shops, light industry, on farms and in hotels, and appliances incorporated in building ventilation systems.", "Does not apply to: air cleaners that intentionally emit harmful radiation; appliances intended exclusively for industrial purposes; locations with special atmospheres; air cleaning systems built into the fabric of the building itself; and appliances intended for medical purposes (a separate series).", "A portable domestic air purifier with a HEPA filter used in a bedroom.", "", "x", "", "", "1", "1", "24M", "99", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8516.10", "8516.10", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-73: Particular requirements for fixed immersion heaters", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-73", "E", "Fixed electric immersion heaters installed in a water container open to the atmosphere for heating water below boiling point, including immersion heaters up to 25 kW used as an alternative heat source in central heating boilers.", "A separate standard covers portable immersion heaters, not this part. The general exclusions of the general part also apply (exclusively industrial use, locations with special atmospheres).", "A fixed electric immersion heater installed in a domestic hot water storage cylinder, used for backup or supplementary heating of a boiler-fed coil.", "", "x", "", "", "1", "1", "24M", "132", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["xxxx", "8516.60", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Particular requirements for outdoor barbecues", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-78", "E", "Electric outdoor barbecues for household and similar use (≤ 250 V), including use by laypersons in shops, restaurants, hotels, light industry and on farms.", "A separate standard covers indoor grills, toasters and similar portable cooking appliances and itself expressly excludes outdoor barbecues (cross-reference). The general exclusions of the general part also apply (locations with special atmospheres).", "An electric outdoor barbecue used on a patio.", "", "x", "", "", "1", "1", "24M", "132", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8414.51", "8414.51", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-80: Particular requirements for fans", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-80", "E", "Electric fans for household and similar purposes and the separate controls supplied with them: ceiling fans, duct fans, partition fans, pedestal fans and table fans.", "Does not apply to: appliances intended exclusively for industrial purposes; locations with special atmospheres; and fans incorporated in other appliances (covered by the standard for that appliance — for example extract fans in ceiling-mounted heating lamp appliances under the relevant standard).", "A domestic ceiling fan with a separate speed controller; and a free-standing pedestal or table fan.", "", "x", "", "", "1", "1", "24M", "110", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["xxxx", "8516.80", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-81: Particular requirements for foot warmers and heating mats", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-81", "E", "Electric foot warmers and heating mats for household and similar purposes, including use by laypersons in shops, light industry and on farms.", "Rigid bed warmers; water bed heaters; heating appliances for animal breeding; heated carpets and under-floor heating units; flexible heated blankets and pads; and appliances used under medical supervision.", "An electric foot warming mat placed under a desk; and a heated floor mat used beside a bed.", "", "x", "", "", "1", "1", "24M", "121", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["xxxx", "8516.79", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-84: Particular requirements for toilet appliances", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-84", "E", "Electric toilet appliances in which waste is stored, dried or destroyed, or which wash and dry parts of the body: composting, freezing and vacuum toilets, and spray (bidet) seats, heated seats and pump units.", "Does not apply to: chemical toilets; toilets in which waste is destroyed by incineration; and locations with special atmospheres.", "An electric spray (bidet) toilet seat with an integrated water heater fitted to a conventional toilet; and a self-contained vacuum or composting toilet in a cabin or boat.", "", "x", "", "", "1", "1", "24M", "132", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["xxxx", "8516.40", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-85: Particular requirements for fabric steamers", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-85", "E", "Electric fabric steamers for household and similar purposes, including use by laypersons in shops, laundries and dry cleaners.", "General-purpose surface-cleaning appliances employing liquids or steam (windows, walls, swimming pools, wallpaper stripping) are covered by a separate standard which expressly excludes fabric steamers.", "A hand-held or stand-mounted garment steamer used to remove creases from clothing.", "", "x", "", "", "1", "1", "24M", "132", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8415 / 8418.21 / 8418.29", "84.15 / 8418.21 / 8418.29", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-88: Particular requirements for humidifiers intended for use with heating, ventilation or air-conditioning systems", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-88", "E", "Electric humidifiers intended for use with heating, ventilation and air-conditioning (HVAC) systems in domestic, commercial and light industrial applications, operating by evaporation, atomization, water injection or steam.", "Self-contained domestic humidifiers not intended for use with HVAC systems are covered by a separate standard which expressly excludes humidifiers incorporated in such systems.", "A steam or evaporative humidifier installed in an air duct and incorporated in the central HVAC/air handling system of a building.", "", "x", "", "", "1", "1", "24M", "242", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8516.60", "8516.60", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-9: Particular requirements for grills, toasters and similar portable cooking appliances", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-9", "E", "Portable household electrical appliances with a cooking function (baking, browning and grilling): toasters, contact grills, hot plates, bread makers, popcorn makers, waffle irons, portable ovens and rotisseries.", "Does not apply to: stationary cooking ranges, hobs and ovens; warming plates; frying pans and deep fat fryers; microwave ovens; outdoor barbecues; appliances burning charcoal or similar fuel; commercial catering appliances; and locations with special atmospheres.", "A pop-up toaster, a contact sandwich grill (panini press), or an electric table-top raclette grill used in a domestic kitchen.", "", "x", "", "", "1", "1", "24M", "132", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8516.8", "8516.80", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-96: Particular requirements for flexible sheet heating elements for room heating", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-96", "E", "Flexible sheet heating elements intended to be incorporated into the building (floors below 1.2 m or above 2.3 m, walls and ceilings) to heat the room in which they are located.", "Heating units exclusively for industrial use; locations with special atmospheres; flexible heated blankets, pads and clothing; foot warmers and heating mats; heated carpets under removable coverings; and heating elements incorporated in other appliances.", "A flexible electric heating mesh or membrane embedded in a ceiling or wall during construction to provide radiant heating for the room.", "", "x", "", "", "1", "1", "24M", "132", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8479.89.90", "8479.89.90", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-98: Particular requirements for humidifiers", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-98", "E", "Self-contained electric humidifiers for household and similar use: appliances that atomize water, evaporate it by heating, or draw air through a wetted element.", "Does not apply to: appliances for heating liquids; humidifiers intended for use with heating, ventilation or air-conditioning systems (covered by a separate standard, not this part); appliances intended for medical purposes (a separate series); and locations with special atmospheres.", "A self-contained ultrasonic or evaporative room humidifier placed on a bedroom floor.", "", "x", "", "", "1", "1", "24M", "242", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8422.11", "8422.11", "Commercial Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-58: Particular requirements for commercial electric dishwashing machines", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-58", "E", "Electrically operated dishwashing machines for washing plates, glassware and cutlery, not intended for household use, used in restaurants, canteens, hospitals, bakeries and butcheries: conveyor, batch and brush machines.", "A separate standard covers domestic dishwashers, not this part. The general exclusions of the general part also apply.", "A conveyor (rack or belt type) dishwasher in a commercial restaurant kitchen; and a commercial batch hood-type dishwasher in a hotel kitchen.", "", "x", "", "", "1", "1", "24M", "242", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8508.11 / 8508.19 / 8508.6 / 8509.8", "8508.11 / 8508.19 / 8508.60 / 8509.80", "Commercial Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-67: Particular requirements for floor treatment machines for commercial use", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-67", "E", "Power-driven floor treatment machines for commercial use indoors and outdoors — scrubbing, wet and dry pick-up, polishing, waxing, shampooing, stripping and grinding — with lateral or rotary cleaning motion, mains- or battery-powered.", "Does not apply to: floor treatment machines for household use; ride-on or pedestrian-controlled machines with a more nearly linear cleaning motion fitted with a traction drive; and machines combining battery and mains supply.", "A ride-on or pedestrian-controlled commercial scrubber-drier used to clean the floor of a supermarket; and a commercial carpet shampooing machine used in a hotel.", "", "x", "", "", "1", "1", "24M", "203", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["xxxx", "8509.40", "Commercial Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-68: Particular requirements for spray extraction machines for commercial use", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-68", "E", "Portable, non-self-propelled electric spray extraction machines (carpet and upholstery cleaning) for commercial indoor use, where the cleaning agent pressure is ≤ 2.5 MPa and the nozzle outlet temperature is ≤ 85 °C.", "Does not apply to machines fitted with a traction drive nor to household floor cleaning appliances. The general exclusions of the general part also apply.", "A portable commercial carpet and upholstery extraction (steam or wet) cleaning machine used by a cleaning contractor in a hotel.", "", "x", "", "", "1", "1", "24M", "203", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8508.11 / 8508.19 / 8508.6 / 8509.8", "8508.11 / 8508.19 / 8508.60 / 8509.80", "Commercial Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-69: Particular requirements for wet and dry vacuum cleaners, including power brush, for commercial use", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-69", "E", "Motor-operated vacuum cleaners (including backpack types and dust extractors) for wet or dry suction or both, for commercial use, without a traction drive, up to 10 kW, and commercial central suction systems.", "Household vacuum cleaners; commercial floor treatment machines; spray extraction machines; hand-held garden blowers and vacuums; hand-held power tools; medical devices; and machines for corrosive environments or explosive atmospheres.", "A commercial wet and dry workshop vacuum used by a cleaning crew in a factory; and an industrial backpack vacuum for general workshop cleaning.", "", "x", "", "", "1", "1", "24M", "203", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["xxxx", "8516.80", "Commercial Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-71: Particular requirements for electrical heating appliances for breeding and rearing animals", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-71", "E", "All types of electrical heating appliances used in breeding and rearing livestock, including those fitted with an electric motor: radiant heat appliances, incubators, hatchers, poultry rearing units and heating plates.", "The general exclusions of the general part apply (exclusively industrial use, locations with special atmospheres). Room heaters intended for human occupants are covered by a separate standard, not this part.", "An electric poultry hatcher used on a farm; and an electric heating plate/brooder for chicks.", "", "x", "", "", "1", "1", "24M", "110", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["84.76", "84.76", "Commercial Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-75: Particular requirements for commercial dispensing appliances and vending machines", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-75", "E", "Commercial electric dispensing appliances and vending machines for preparing or delivering food, beverages and consumer products: coffee and tea machines, hot and cold drink vending machines, water, ice-cream and ice dispensers, and refrigerated display units.", "Appliances exclusively for household or industrial use; locations with special atmospheres; commercial coffee grinders in places not open to the public; commercial boiling pans and bains-marie; amusement machines; and commercial refrigerating appliances.", "A coin- or card-operated hot and cold beverage vending machine in an office break room; and a self-service ice-cream dispensing machine in a shop.", "", "x", "", "", "1", "1", "24M", "242", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["xxxx", "8422.20", "Commercial Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-79: Particular requirements for high pressure cleaners and steam cleaners", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-79", "E", "High pressure cleaners without a traction drive for household and commercial use, with rated pressures from 2.5 to 35 MPa, supplied from the mains, by batteries or by internal combustion engines, and steam cleaners.", "Water jetting machines above 35 MPa; household appliances cleaning with liquids or steam; hand-held power tools; appliances incorporated in processing equipment; audio, video and medical appliances; and locations with special atmospheres.", "A domestic electric pressure washer used to clean a driveway or patio.", "", "x", "", "", "1", "1", "24M", "203", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["9504.30 / 9504.50", "9504.30 / 9504.50", "Commercial Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-82: Particular requirements for amusement machines and personal service machines", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-82", "E", "Commercial electric amusement machines and personal service machines: billiard tables, bowling machines, dart boards, driving simulators, gaming machines, children’s rides and pinball machines, and coin dispensers, luggage lockers, weighing machines and shoe polishing appliances.", "Appliances exclusively for household or industrial use; locations with special atmospheres; car wash appliances; dispensing appliances and vending machines; jukeboxes and domestic video games; copying, ticket and cash dispensing machines; and fairground equipment.", "A coin-operated pinball or video game cabinet in an amusement arcade; and a coin-operated shoe polishing machine in a hotel lobby.", "", "x", "", "", "1", "1", "24M", "132", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["xxxx", "8479.89.90", "Commercial Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-86: Particular requirements for electric fishing machines", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-86", "E", "Electric fishing machines capable of electrifying water to catch fish or to form barriers to aquatic animals, for scientific and commercial use, up to 1000 V for machines permanently connected to fixed wiring.", "A separate standard covers electric fence energizers (and itself excludes electric fishing machines). A separate standard covers electrical animal stunning equipment.", "A backpack or boat-mounted electrofishing unit used by fisheries researchers to temporarily stun fish for sampling.", "", "x", "", "", "1", "1", "24M", "110", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["xxxx", "8479.89.90", "Commercial Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-87: Particular requirements for electrical animal stunning equipment", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-87", "E", "Electrical animal stunning equipment for industrial, commercial or farm use, manual, semi-automatic or automatic, for cattle, sheep, goats, deer, solipeds, poultry, pigs, fur animals and other ruminants.", "A separate standard covers electric fence energizers. A separate standard covers electric fishing machines.", "Electrical stunning tongs/equipment used in a commercial abattoir to render livestock unconscious before slaughter.", "", "x", "", "", "1", "1", "24M", "99", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8418.3 / 8418.4 / 8418.5", "8418.50.00", "Commercial Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-89: Particular requirements for commercial refrigerating appliances with an incorporated or remote refrigerant unit or compressor", "9847", "29/05/2023", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-89", "E", "Electrically operated commercial refrigerating appliances and ice makers with an incorporated motor-compressor or supplied as a two-unit split system: refrigerated display cabinets, storage cabinets, self-service counters, and blast chillers and freezers.", "The refrigeration-specific construction and operating characteristics covered by the ISO refrigeration standards fall outside this standard (it covers electrical and general hazards). Household refrigerating appliances are covered by a separate standard, not this part.", "A multi-deck open refrigerated display cabinet in a supermarket; and a commercial blast chiller in a restaurant kitchen.", "", "x", "", "", "1", "1", "24M", "242", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8516.50", "8516.50", "Commercial Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-90: Particular requirements for commercial microwave ovens", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-90", "E", "Microwave ovens with a cavity door intended for commercial use in processing food in the kitchens of restaurants, canteens, hospitals, bakeries and butcheries, including combination ovens and conveyor ovens without a cavity door.", "Household microwave ovens (including combination ovens) used by laypersons in staff kitchens, farmhouses, hotels and guest houses are covered by a separate standard. The general exclusions of the series apply.", "A commercial-grade microwave oven used behind the counter in a small shop or fast food kitchen to reheat food quickly.", "", "x", "", "", "1", "1", "24M", "203", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["85.01", "85.01", "Commercial Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-97: Particular requirements for drives for rolling shutters, awnings, blinds and similar equipment", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-97", "E", "Electric drives for rolling shutters, blinds and awnings for household and similar purposes, including drives for equipment whose driven part is spring-controlled: folding awnings, blinds, screens, projection screens, and hinged and sliding shutters.", "Exclusively industrial use and locations with special atmospheres. Drives for vertically moving residential garage doors and drives for gates, doors and windows are covered by separate standards.", "An electric drive that raises and lowers a roller shutter or a folding awning in a dwelling.", "", "x", "", "", "1", "1", "24M", "110", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8414.60", "8516.60", "Commercial Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-99: Particular requirements for commercial electric hoods", "9847", "21/02/2013", "Certificate of Conformity (087)", "Industrial Research Institute", "NL  EN 60335-2-99", "E", "Electrically operated commercial hoods, as complete units or as parts assembled to form a working hood incorporating a fan, for installation above commercial cooking appliances in the kitchens of restaurants, canteens, hospitals and bakeries, with back-draught, down-draught and fume extraction systems.", "Domestic cooker hoods and cooking fume extractors are covered by a separate standard. Purpose-built hoods (site-constructed or one-off factory-made) fall outside the scope, although the standard may be used for guidance.", "A commercial stainless steel hood with an integrated fan installed above the cooking range in a restaurant kitchen.", "", "x", "", "", "1", "1", "24M", "203", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["", "8516.40", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-3: Particular requirements for electric irons (IEC 60335-2-3)", "7176", "18/01/2002", "Certificate of Conformity (087)", "Industrial Research Institute", "NL 101-2-3", "E", "Electric dry irons and steam irons, including those with a separate water tank or boiler of capacity ≤ 5 l, for household and similar purposes, including use in shops, light industry and on farms.", "Does not apply to: cylinder irons, ironing presses and other garment finishing appliances; ironing boards; appliances intended exclusively for industrial purposes; and locations with special atmospheres.", "A domestic steam iron with a separate water tank or boiler, or a simple dry travel iron.", "", "x", "", "", "1", "132", "24m", "132", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8508.11 / 8508.19 / 8508.60", "8508.11 / 8508.19 / 8508.60 / 8509.80", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-10: Particular requirements for floor treatment machines and wet scrubbing machines (IEC 60335-2-10)", "7176", "18/01/2002", "Certificate of Conformity (087)", "Industrial Research Institute", "NL 101-2-10", "E", "Electric floor treatment machines and wet scrubbing machines for household and similar purposes: floor burnishers, polishers and waxers, and floor scrubbers and carpet and upholstery shampooing machines.", "Does not apply to: vacuum cleaners and water-suction cleaning appliances; appliances intended exclusively for industrial purposes (commercial and industrial floor machines without a traction drive are covered elsewhere, as are those with a traction drive); and locations with special atmospheres.", "A domestic electric floor polisher/burnisher; and a carpet and upholstery shampooing machine for household use.", "", "x", "", "", "1", "1", "24M", "203", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8419.81 / 8516.71 / 8516.72", "8419.81 / 8516.71 / 8516.72", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-12: Particular requirements for warming plates and similar appliances (IEC 60335-2-12)", "7176", "18/01/2002", "Certificate of Conformity (087)", "Industrial Research Institute", "NL 101-2-12", "E", "Electric warming plates, warming trays and similar appliances intended to keep food or vessels warm, for household and similar purposes, excluding appliances intended for professional food warming or commercial food processing.", "Appliances made of flexible materials such as textiles; appliances intended exclusively for commercial catering (commercial food and dish warming and bains-marie); appliances exclusively for industrial use; locations with special atmospheres; and warming cabinets.", "An electric food warming tray or hot plate used to keep dishes warm on a dining table or sideboard.", "", "x", "", "", "1", "1", "24M", "132", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8516.10", "8516.10", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-35: Particular requirements for instantaneous water heaters (IEC 60335-2-35)", "7176", "18/01/2002", "Certificate of Conformity (087)", "Industrial Research Institute", "NL 101-2-35", "E", "Electric instantaneous water heaters for household and similar purposes for heating water below boiling point, including units incorporating bare electrode-type heating elements.", "Does not apply to: water boiling appliances; storage water heaters; commercial electric water boilers and liquid heaters; commercial dispensing appliances and vending machines; appliances intended exclusively for industrial purposes; and locations with special atmospheres.", "An instantaneous (tankless) electric water heater installed under a kitchen or bathroom sink to provide hot water on demand.", "", "x", "", "", "1", "1", "24M", "132", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8516.79", "8516.79", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-66: Particular requirements for water bed heaters (IEC 60335-2-66)", "7176", "18/01/2002", "Certificate of Conformity (087)", "Industrial Research Institute", "NL 101-2-66", "E", "Electric water bed heaters and their associated controls for household and similar purposes, including use in hotels.", "Appliances intended for medical purposes and appliances intended to be immersed in water during use. Rigid bed warmers, heated blankets and pads, foot warmers and heating mats are covered separately.", "An electric heating pad placed under a water mattress (water bed) with a separate thermal control unit.", "", "x", "", "", "1", "1", "24M", "132", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8451.29 / 8451.21", "8451.21 / 8451.29", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-11: Particular requirements for tumble dryers (IEC 60335-2-11)", "12381", "30/04/2004", "Certificate of Conformity (087)", "Industrial Research Institute", "NL 101-2-11", "E", "Electric tumble dryers for household and similar purposes, including the drying function of washing machines with a drying cycle and dryers operating on a hermetically sealed compressor cooling system, among them communal dryers in blocks of flats and launderettes.", "The general exclusions of the general part apply (exclusively industrial use, locations with special atmospheres).", "A domestic electric tumble dryer (vented or heat pump/condenser type) used in a household utility room.", "", "x", "", "", "1", "1", "24M", "242", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8516.60", "8516.60", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-13: Particular requirements for deep fat fryers, frying pans and similar appliances (IEC 60335-2-13)", "12381", "30/04/2004", "Certificate of Conformity (087)", "Industrial Research Institute", "NL 101-2-13", "E", "Electric deep fat fryers with a maximum recommended oil quantity ≤ 5 l, frying pans, woks and other appliances in which oil is used for cooking, for household and similar use.", "Does not apply to: deep fat fryers for commercial use; commercial multi-purpose cooking pans; and locations with special atmospheres.", "A domestic electric deep fat fryer with a removable oil basket; and an electric wok or thermostatically controlled frying pan.", "", "x", "", "", "1", "1", "24M", "132", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["xxxx", "8516.79", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-15: Particular requirements for appliances for heating liquids (IEC 60335-2-15)", "12381", "30/04/2004", "Certificate of Conformity (087)", "Industrial Research Institute", "NL 101-2-15", "E", "Electrical appliances for heating liquids for household and similar purposes: coffee machines, egg boilers, baby bottle warmers, kettles (≤ 10 l), milk warmers, pressure cookers, rice and steam cookers, and tea and yoghurt makers.", "Frying pans and deep fat fryers; storage and instantaneous water heaters; surface-cleaning appliances using liquids or steam; portable immersion heaters; commercial dispensing appliances; medical and industrial appliances; and pressure sterilizers and humidifiers.", "An electric kettle, rice cooker, slow cooker, or hob-shaped electric pressure cooker used in a domestic kitchen.", "", "x", "", "", "1", "1", "24M", "132", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8516.31 / 8516.32 / 8516.33 / 8424.89 / 8516.79 / 8543.70.90", "8516.31 / 8516.32 / 8516.33", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-23: Particular requirements for appliances for skin or hair care (IEC 60335-2-23)", "12381", "30/04/2004", "Certificate of Conformity (087)", "Industrial Research Institute", "NL 101-2-23", "E", "Electrical appliances for the care of the skin or hair of persons or animals, which may incorporate steam- or mist-generating devices: combs, curling irons and rollers, facial saunas, hair dryers, hair straighteners and hand dryers.", "Shavers and hair clippers; flexible heated blankets, pads and clothing; appliances exposing the skin to optical, ultraviolet or infrared radiation; sauna appliances; and laser or intense light cosmetic appliances and medical devices.", "A domestic hair dryer or hair straightener; and a facial steamer/sauna.", "", "x", "", "", "1", "1", "24M", "132", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8418.10 / 8418.21 / 8418.29 / 8418.69 / 8418.4 / 8418.5 / 8418.3", "8418.69", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-24: Particular requirements for refrigerating appliances, ice-cream appliances and ice-makers (IEC 60335-2-24)", "12381", "30/04/2004", "Certificate of Conformity (087)", "Industrial Research Institute", "NL 101-2-24", "E", "Refrigerating appliances for household and similar use, ice makers incorporating a motor-compressor or intended for building into frozen food compartments, refrigerating appliances for camping, caravans and boats, domestic ice-cream appliances and appliances using flammable refrigerants.", "Appliances for outdoor use; appliances exclusively for industrial use; locations with special atmospheres; appliances assembled on site; appliances with remote compressors; the compressors themselves; commercial dispensing and refrigerating appliances; and professional ice-cream machines.", "A domestic fridge-freezer; a domestic ice-cream maker with an integrated compressor; and a 12/24 V compressor cooler for a caravan or boat.", "", "x", "", "", "1", "1", "24M", "242", "Technology & Development Directorate", "Electrical & Renewable Energy Division", "Electrical Lab", "Home Appliances"], ["8516.50", "8516.50", "Household Electrical Appliances", "Household and similar electrical appliances - Safety - Part 2-25: Particular requirements for microwave ovens, including combination microwave ovens (IEC 60335-2-25)", "12381", "30/04/2004", "Certificate of Conformity (087)", "Industrial Research Institute", "NL 101-2-25", "E", "Microwave ovens for household and similar use, including use by laypersons in shops, light industry and on farms, combination ovens and ovens intended for use on board ships, excluding professional or commercial processing ovens.", "Commercial microwave ovens; commercial microwave appliances wit const STOP = new Set(("the and for with from that this are was were has have had its into over under not all any " +
  "other than such use used using also which their them they who whom one two may can per etc only each more most " +
  "part general requirement requirements method methods test tests testing specification specifications product " +
  "products type types including include includes intended similar purpose purposes household " +
  "company companies brand brands manufacturer manufacturers manufacturing manufactures corporation multinational " +
  "international founded headquartered headquarters based known american french german italian chinese japanese " +
  "korean british lebanese turkish swiss dutch spanish inc ltd llc group subsidiary owned global world largest " +
  "public private sells sold produces produced makes made founded since year years range line lines market " +
  "markets founder founders city country state wikipedia article name named first new related develop develops " +
  "developed support supports repair repairs smart technology technologies system systems solution solutions service " +
  "services provide provides offer offers operate operates owned business businesses industry industries consumer " +
  "consumers equipment device devices headquarter label").split(" "));

// Extra words ignored only when they come from a web description (too generic there).
const WEB_STOP = new Set(["power", "electric", "electrical", "electronic", "electronics", "digital", "home",
  "quality", "safety", "standard", "energy", "material", "materials", "component", "components", "unit", "units"]);

let DATA = [], INDEX = [];

function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function stem(w) {
  if (w.length > 4 && w.endsWith("ies")) return w.slice(0, -3) + "y";
  if (w.length > 4 && /(ches|shes|xes|sses|zes)$/.test(w)) return w.slice(0, -2);
  if (w.length > 3 && w.endsWith("s") && !w.endsWith("ss") && !w.endsWith("us")) return w.slice(0, -1);
  return w;
}
function tokens(s) {
  return norm(s).split(/[^a-z0-9]+/).filter(w => w.length > 2 && !STOP.has(w) && !/^\d+$/.test(w)).map(stem);
}
function digits(s) { return String(s || "").replace(/[^0-9]/g, ""); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function load(rawRows) {
  DATA = rawRows.map(a => Object.fromEntries(COLS.map((k, i) => [k, String(a[i] ?? "").trim()])))
                .filter(r => r.category || r.standard);
  INDEX = DATA.map(r => ({
    category: new Set(tokens(r.category)),
    description: new Set(tokens(r.description)),
    examples: new Set(tokens(r.examples)),
    scope: new Set(tokens(r.scope)),
    portal: new Set(tokens(r.portal)),
    outScope: new Set(tokens(r.outScope)),
    hsCodes: (r.hs + "/" + r.customsHs).split(/[\/,;]| or |\s-\s/i).map(digits).filter(d => d.length >= 2),
  }));
  IDF_CACHE.clear();
  const cats = new Set(DATA.map(r => r.category));
  document.getElementById("dbInfo").textContent = `Database: ${DATA.length} standards in ${cats.size} categories`;
}

// A query word matches a field when the stems are equal or share a 6-letter root
// (refrigerator ~ refrigerating, heater ~ heating is not matched on purpose).
function hit(set, q) {
  if (set.has(q)) return true;
  if (q.length < 6) return false;
  const root = q.slice(0, 6);
  for (const t of set) if (t.length >= 6 && t.startsWith(root)) return true;
  return false;
}

const WEIGHTS = { category: 6, description: 4, examples: 3, portal: 3, scope: 2 };
// Words taken from a web description are noisier, so they only count in the main fields.
const WEB_WEIGHTS = { category: 6, portal: 3, description: 2 };

function scoreRow(i, terms, hsQuery) {
  const ix = INDEX[i];
  let score = 0, matched = new Set(), outHits = [];
  if (hsQuery) {
    for (const code of ix.hsCodes) {
      if (code.startsWith(hsQuery) || hsQuery.startsWith(code)) {
        score += 10 + Math.min(code.length, hsQuery.length);
        matched.add("#hs");
      }
    }
  }
  for (const { t, w, web } of terms) {
    let best = 0;
    const weights = web ? WEB_WEIGHTS : WEIGHTS;
    for (const f in weights) if (hit(ix[f], t)) best = Math.max(best, weights[f]);
    if (best) { score += best * w; matched.add(t); }
    else if (w >= 0.5 && hit(ix.outScope, t)) outHits.push(t);
  }
  return { score, matched, outHits };
}

// Rarity weight of a word: words found in many categories ("system", "water")
// say little about the product, words found in one or two say a lot.
const IDF_CACHE = new Map();
function idf(t) {
  if (!IDF_CACHE.has(t)) {
    const cats = new Set(), all = new Set(DATA.map(r => r.category));
    DATA.forEach((r, i) => { if (hit(INDEX[i].category, t) || hit(INDEX[i].description, t)) cats.add(r.category); });
    IDF_CACHE.set(t, cats.size ? Math.log(1 + all.size / cats.size) / Math.log(1 + all.size) : 0);
  }
  return IDF_CACHE.get(t);
}

function rank(userTerms, webTerms, hsQuery) {
  const terms = [...userTerms.map(t => ({ t, w: 0.5 + 0.5 * idf(t) })),
                 ...webTerms.map(t => ({ t, w: 0.5 * idf(t), web: true }))];
  const cats = new Map();
  DATA.forEach((r, i) => {
    const s = scoreRow(i, terms, hsQuery);
    if (!cats.has(r.category)) cats.set(r.category, { category: r.category, rows: [], best: 0, userHits: new Set() });
    const c = cats.get(r.category);
    c.rows.push({ r, s: s.score, out: s.outHits });
    c.best = Math.max(c.best, s.score);
    s.matched.forEach(t => { if (t === "#hs" || userTerms.includes(t)) c.userHits.add(t); });
  });
  const list = [...cats.values()].filter(c => c.userHits.size > 0 || c.best >= 1.5);
  // Reward categories that cover more of the words the user typed.
  for (const c of list) {
    const cover = userTerms.length ? c.userHits.size / userTerms.length : 0;
    c.total = c.best * (1 + cover) + Math.log(1 + c.rows.filter(x => x.s > 0).length);
    c.rows.sort((a, b) => b.s - a.s);
    c.outHits = new Set(c.rows[0].out);  // exclusions of the best-matching standard only
  }
  return list.sort((a, b) => b.total - a.total);
}

async function webLookup(query) {
  const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search" +
    "&gsrlimit=3&prop=extracts&exintro=1&explaintext=1&exsentences=3&exlimit=3&gsrsearch=" + encodeURIComponent(query);
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const json = await res.json();
  const pages = Object.values(json?.query?.pages || {}).sort((a, b) => a.index - b.index);
  return pages.filter(p => p.extract).slice(0, 2)
    .map(p => ({ title: p.title, extract: p.extract, url: "https://en.wikipedia.org/wiki/" + encodeURIComponent(p.title.replace(/ /g, "_")) }));
}

function uniq(arr) { return [...new Set(arr.filter(Boolean))]; }

function highlight(text, terms) {
  let html = esc(text);
  for (const t of terms) {
    if (t.length < 3 || t.startsWith("#")) continue;
    const root = t.length >= 6 ? t.slice(0, 6) : t;
    html = html.replace(new RegExp("\\b(" + root.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[a-z]*)", "gi"), "<mark>$1</mark>");
  }
  return html;
}

function standardsTable(rows, terms) {
  const body = rows.map(({ r }) => {
    const tests = ["M", "S", "P", "D"].filter(k => r[k]).join(", ");
    return `<tr>
      <td><b>${esc(r.standard)}</b></td>
      <td>${highlight(r.description, terms)}
        <details class="std"><summary>Scope / out of scope / examples</summary>
          <p><b>Scope:</b> ${highlight(r.scope, terms) || "—"}</p>
          <p><b>Out of scope:</b> ${highlight(r.outScope, terms) || "—"}</p>
          <p><b>Examples:</b> ${highlight(r.examples, terms).replace(/\n+/g, "<br>") || "—"}</p>
          <p class="muted">Tests: ${esc(tests) || "—"} · Priority: ${esc(r.priority) || "—"} · Samples: ${esc(r.samples) || "—"} ·
            Type approval: ${esc(r.typeApproval) || "—"} · Price: ${r.price ? "$" + esc(r.price) : "—"} ·
            ${esc(r.lab)} (${esc(r.division)})</p>
        </details></td>
      <td>${esc(r.hs || r.customsHs)}</td>
      <td>${esc(r.decreeNo)}<br><span class="muted">${esc(r.decreeDate)}</span></td>
      <td>${esc(r.restriction)}</td>
    </tr>`;
  }).join("");
  return `<div class="scroll"><table class="tbl"><thead><tr>
    <th>Standard</th><th>Description</th><th>HS code</th><th>Decree</th><th>Restriction</th>
    </tr></thead><tbody>${body}</tbody></table></div>`;
}

// The standards that best fit the product: those scoring at least 60% of the top one.
function bestRows(c) { return c.rows.filter(x => x.s > 0 && x.s >= c.rows[0].s * 0.6); }

function summary(c, rows) {
  const rs = rows.map(x => x.r);
  const decrees = uniq(rs.map(r => r.decreeNo ? `${r.decreeNo}${r.decreeDate ? " (" + r.decreeDate + ")" : ""}` : ""));
  return `<div class="kv">
    <div><b>Category</b><span>${esc(c.category)}</span></div>
    <div><b>Section</b><span>${esc(uniq(rs.map(r => r.section)).join(", ") || "—")}</span></div>
    <div><b>Sector (portal)</b><span>${esc(uniq(rs.map(r => r.portal)).join(", ") || "—")}</span></div>
    <div><b>HS code(s)</b><span>${esc(uniq(rs.map(r => r.hs || r.customsHs)).join(" · ") || "—")}</span></div>
    <div><b>Decree No. (date)</b><span>${esc(decrees.join(" · ") || "—")}</span></div>
    <div><b>Restriction & NAJM code</b><span>${esc(uniq(rs.map(r => r.restriction)).join(" · ") || "—")}</span></div>
    <div><b>Valid reference (lab)</b><span>${esc(uniq(rs.map(r => r.validRef)).join(" · ") || "—")}</span></div>
    <div><b>Matching standards</b><span>${rs.length} of ${c.rows.length} in this category</span></div>
  </div>`;
}

function searchLinks(q) {
  const g = s => "https://www.google.com/search?q=" + encodeURIComponent(s);
  return `<div class="links">Search further:
    <a href="${g(q + " HS code")}" target="_blank" rel="noopener">HS code on Google</a>
    <a href="${g(q + " product")}" target="_blank" rel="noopener">What is this product?</a>
    <a href="${g(q + " IEC ISO EN standard")}" target="_blank" rel="noopener">Applicable standards</a></div>`;
}

function render(query, userTerms, webTerms, hsQuery, web, webError) {
  const out = document.getElementById("out");
  const list = rank(userTerms, webTerms, hsQuery);
  const allTerms = [...userTerms, ...webTerms];
  let html = "";

  if (web && web.length) {
    html += `<div class="card"><h2>What the web says</h2>` + web.map(p =>
      `<div class="web"><b><a href="${p.url}" target="_blank" rel="noopener">${esc(p.title)}</a></b> — ${esc(p.extract)}</div>`).join("") +
      searchLinks(query) + `</div>`;
  } else if (webError) {
    html += `<div class="card"><div class="warnbox">Web lookup unavailable (${esc(webError)}). Results use the Excel list only.</div>${searchLinks(query)}</div>`;
  }

  if (!list.length) {
    html += `<div class="card verdict none"><span class="badge b-no">Not found in IRI list</span>
      <h2 style="margin-top:8px">No IRI category matches “${esc(query)}”</h2>
      <p>The product does not appear in the IRI standards list, so no IRI decree or standard was identified.
      Try a more generic name (e.g. “water heater” instead of a model number), add the company name, or enter the HS code.</p>
      ${searchLinks(query)}</div>`;
    out.innerHTML = html;
    return;
  }

  const top = list[0];
  const direct = top.userHits.size > 0;
  const strong = direct && (top.userHits.has("#hs") || top.userHits.size >= Math.min(2, userTerms.length));
  const cls = strong ? "" : "maybe";
  const badge = strong ? `<span class="badge b-ok">Subject to decree & standard</span>`
                       : `<span class="badge b-maybe">Possible match — please verify</span>`;
  const best = bestRows(top);
  const decrees = uniq(best.map(x => x.r.decreeNo));
  const stds = uniq(best.map(x => x.r.standard));

  html += `<div class="card verdict ${cls}">${badge}
    <h2 style="margin-top:8px">${esc(top.category)}</h2>
    <p>“${esc(query)}” ${strong ? "falls under" : "most likely falls under"} the category <b>${esc(top.category)}</b>.
      It is subject to decree${decrees.length > 1 ? "s" : ""} <b>${esc(decrees.join(", ")) || "—"}</b>
      and to the standard${stds.length > 1 ? "s" : ""} <b>${esc(stds.slice(0, 8).join(", "))}${stds.length > 8 ? "…" : ""}</b>.</p>
    ${direct ? "" : `<p class="muted">This match comes only from the web description of the product, not from the words you typed.</p>`}
    ${top.outHits.size ? `<div class="warnbox">“${esc([...top.outHits].join(", "))}” appears in the <i>Out of scope</i> text of the best-matching standard (${esc(top.rows[0].r.standard)}). Check that the product is not excluded.</div>` : ""}
    ${summary(top, best)}
    <h2>Applicable standards</h2>
    <p class="muted">Open a row to see scope, exclusions and examples.</p>
    ${standardsTable(best, allTerms)}
    ${top.rows.length > best.length ? `<details class="alt"><summary>All ${top.rows.length} standards in “${esc(top.category)}”</summary>
      <div>${standardsTable(top.rows, allTerms)}</div></details>` : ""}
  </div>`;

  const others = list.slice(1, 6);
  if (others.length) {
    html += `<div class="card"><h2>Other possible categories</h2>` + others.map(c => {
      const b = bestRows(c);
      return `<details class="alt"><summary><b>${esc(c.category)}</b> <span class="muted">— HS ${esc(uniq(b.map(x => x.r.hs || x.r.customsHs)).slice(0, 3).join(", "))} ·
        Decree ${esc(uniq(b.map(x => x.r.decreeNo)).join(", "))} · ${esc(uniq(b.map(x => x.r.standard)).slice(0, 3).join(", "))}</span></summary>
        <div>${summary(c, b)}${standardsTable(b, allTerms)}</div></details>`;
    }).join("") + `</div>`;
  }
  out.innerHTML = html;
}

let searchId = 0;
async function run(e) {
  e && e.preventDefault();
  const product = document.getElementById("q").value.trim();
  const company = document.getElementById("co").value.trim();
  if (!product && !company) return;
  const query = [product, company].filter(Boolean).join(" ");
  const id = ++searchId;

  const hsRaw = /^[\d.\s\/-]+$/.test(product) ? digits(product) : "";
  const hsQuery = hsRaw.length >= 2 ? hsRaw : "";
  const userTerms = uniq(tokens(product));

  render(query, userTerms, [], hsQuery, null, null);
  if (!document.getElementById("useWeb").checked || hsQuery) return;

  const out = document.getElementById("out");
  out.insertAdjacentHTML("afterbegin", `<div class="card muted" id="loading">Searching the web for “${esc(query)}”…</div>`);
  let web = [], err = null;
  try {
    web = await webLookup(query);
    if (!web.length && product && company) web = await webLookup(product);
  } catch (ex) { err = ex.message || "network error"; }
  if (id !== searchId) return;

  const webTerms = uniq(web.flatMap(p => tokens(p.title + " " + p.extract)))
    .filter(t => !userTerms.includes(t) && !WEB_STOP.has(t) && !tokens(company).includes(t)).slice(0, 40);
  render(query, userTerms, webTerms, hsQuery, web, err);
}

document.getElementById("f").addEventListener("submit", run);
document.getElementById("loadBtn").addEventListener("click", () => document.getElementById("file").click());
document.getElementById("file").addEventListener("change", async ev => {
  const file = ev.target.files[0];
  if (!file) return;
  try {
    if (!window.XLSX) await new Promise((ok, fail) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = ok; s.onerror = () => fail(new Error("could not load the Excel reader (offline?)"));
      document.head.appendChild(s);
    });
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" }).slice(2)
      .map(a => a.map(v => v instanceof Date
        ? `${String(v.getDate()).padStart(2, "0")}/${String(v.getMonth() + 1).padStart(2, "0")}/${v.getFullYear()}` : v));
    load(rows);
    document.getElementById("out").innerHTML = `<div class="card">Loaded <b>${esc(file.name)}</b>: ${DATA.length} standards. This lasts until the page is reloaded — run build_lookup.py to make it permanent.</div>`;
  } catch (ex) {
    alert("Could not read the file: " + ex.message);
  }
});

load(RAW);
